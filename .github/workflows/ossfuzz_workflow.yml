name: OSS-Fuzz

# Skip the run on *.md changes and on changes to the website.
# Also, no need to run on changes to the bazel setup.

on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - '!bazel/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ossfuzz_workflow.yml'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - '!bazel/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ossfuzz_workflow.yml'

permissions:
  contents: read

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1
      with:
        # Explicitly use this fork repo so OSS-Fuzz can locate the commit SHA.
        repository: baaaaaaaka/Openexr
        ref: ${{ github.sha }}
        fetch-depth: 0
        # CIFuzz copies the repo into /src/<basename>. OSS-Fuzz project's Dockerfile
        # expects it at /src/openexr, so ensure the checkout directory name matches.
        path: openexr
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@aaf9682d5a174a4902d62bcec86a783f605af958 # master
      with:
        oss-fuzz-project-name: 'openexr'
        dry-run: false
        language: c++
        # Note: this action uses OSS-Fuzz "internal" mode by default and tries to
        # detect/checkout the main repo from the project Dockerfile. That breaks
        # for fork-only commits because the project Dockerfile clones upstream.
        #
        # We therefore provide a local checkout and force CIFuzz to use the
        # generic CI platform config so it will build using this workspace copy.
        # This must be a host path (used for docker volume mounting).
        project-src-path: ${{ github.workspace }}/openexr
      env:
        # Force CIFuzz to use BasePlatformConfig (internal generic CI) so it
        # uses PROJECT_SRC_PATH (our checkout) rather than trying to infer the
        # repo name from GITHUB_REPOSITORY and copying from the image.
        CFL_PLATFORM: generic
        WORKSPACE: ${{ github.workspace }}
        # The OSS-Fuzz Dockerfile clones "openexr" (lowercase); ensure repo
        # detection uses the same name.
        REPOSITORY: openexr
        # Provide a base commit for diffing (push events); if empty, CIFuzz will
        # keep all fuzz targets.
        GIT_BASE_COMMIT: ${{ github.event.before }}
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@aaf9682d5a174a4902d62bcec86a783f605af958 # master
      with:
        oss-fuzz-project-name: 'openexr'
        fuzz-seconds: 300
        dry-run: false
        language: c++
      env:
        # Keep CIFuzz platform config consistent with the build step.
        CFL_PLATFORM: generic
        WORKSPACE: ${{ github.workspace }}
        REPOSITORY: openexr
        GIT_BASE_COMMIT: ${{ github.event.before }}
    - name: Upload Crash
      uses: actions/upload-artifact@v5
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
